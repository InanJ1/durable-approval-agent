[project]
name = "corvane-durable-approval-agent"
version = "0.1.0"
description = "Durable purchase-request approvals for Corvane Industrial: LangGraph agent + Temporal workflow"
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.34.0",
    "langgraph==1.2.16",
    "langgraph-cli[inmem]==0.4.36",
    "langgraph-sdk==0.4.8",
    "langchain-openai==1.7.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["approval", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
